name: mirror-claude-changelog

on:
  # 30분 간격. 정시(:00)는 전 세계 워크플로가 몰려 큐 지연이 커지므로 피한다.
  # GitHub 스케줄은 정시 보장이 없다 — 실측 결과 "매시간" 설정이 평균 1.6시간,
  # 최대 2.75시간으로 벌어졌고 그 구멍에 릴리스 하나를 놓쳤다.
  # 15분 간격도 시도했으나 스케줄이 등록되지 않아(1시간 36분간 0회) 30분으로 완화했다.
  schedule: [{ cron: "11,41 * * * *" }]
  workflow_dispatch:                  # 수동 실행

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4

      # lastBuildDate는 매 요청마다 갱신되므로 제거한다.
      # 그대로 두면 내용이 그대로인데도 매시간 diff가 생겨 커밋이 쌓인다.
      - name: 피드 미러
        run: |
          curl -sSf --max-time 30 https://claude.com/docs/cowork/changelog/rss.xml \
            | sed '/<lastBuildDate>/d' > feed.xml
          grep -q '<item>' feed.xml   # 빈 응답/에러 페이지를 커밋하지 않도록 검증

      # 전 항목이 "No user-facing changes."인 <item>(내부 빌드)은 미러에서 제거한다.
      # routine 프롬프트에도 같은 규칙이 있지만 LLM 판단이라 100%가 아니다 — 여기서 결정론적으로 거른다.
      # 한 섹션이라도 실제 항목이 있으면 남긴다. <li>가 하나도 없는 항목도 남긴다(포맷 변경 감지용).
      # 원문 문구가 바뀌면 필터가 조용히 꺼진다(fail-open) — 릴리스를 놓치지 않고 노이즈만 돌아온다.
      - name: 내부 빌드 제거
        run: |
          python3 - <<'PY'
          import re
          s = open('feed.xml').read()
          def keep(m):
              lis = [l.strip() for l in re.findall(r'<li>(.*?)</li>', m.group(0), re.S)]
              return '' if lis and all(l == 'No user-facing changes.' for l in lis) else m.group(0)
          open('feed.xml', 'w').write(re.sub(r'\s*<item>.*?</item>', keep, s, flags=re.S))
          PY

      - name: 변경 있을 때만 커밋
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add feed.xml
          git diff --cached --quiet && { echo "변화 없음"; exit 0; }
          git commit -m "mirror: $(date -u +%FT%TZ)"
          git push
